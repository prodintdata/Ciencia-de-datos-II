priority_harm: >-
  Falso negativo: un caso que sí requería revisión queda abajo en la cola y no
  se atiende a tiempo. El daño se concentra en G1, donde el modelo detecta menos
  positivos reales (recall 0.653 frente a 0.791 en G2).
primary_metric: >-
  Brecha de recall (TPR) entre protected_group, con recall global como
  condición mínima. La brecha de FPR se usa como métrica secundaria porque
  una alerta falsa solo genera revisión humana adicional.
tolerance: >-
  Recall global >= 0.68 y brechas de recall y FPR <= 0.16 entre grupos
  (configs/governance.yml). El soporte se juzga por clase: el recall de un
  subgrupo se interpreta solo con al menos 20 positivos reales y la FPR con al
  menos 20 negativos reales; si no, la cifra es exploratoria.
evidence: >-
  Regresión logística: recall 0.717, brecha de recall 0.138, brecha de FPR
  0.125, accuracy 0.719, 3.6 KB. Árbol: recall 0.717, brecha de recall 0.181,
  brecha de FPR 0.168, accuracy 0.706, 7.9 KB. Solo la logística cumple los
  umbrales (reports/lab12/*/global_metrics.json, fairness_by_group.csv).
limitation: >-
  El test tiene 160 casos (G1=101, G2=59). G2 tiene solo 16 negativos y ningún
  grupo interseccional llega a 20 positivos ni a 20 negativos (máximo 17 y 18),
  así que las brechas son inestables y sus intervalos son amplios
  (reports/e07/support_by_class.csv). La prevalencia difiere por grupo (G1 0.49,
  G2 0.73). Los datos son sintéticos. Una brecha observada no prueba
  discriminación causal.
recommendation: >-
  Usar la regresión logística solo en piloto con revisión humana obligatoria
  (REVIEW). Antes de pasar a GO hay que investigar el bajo recall de G1, sobre
  todo de G1 | 30-44, el subgrupo con menor recall (0.562, 9 de 16 positivos),
  y de G1 | 45-59 (0.588, 10 de 17), y la FPR de G2 | 60+ (0.556, 5 de 9
  negativos). Son cifras exploratorias por falta de soporte. Se descarta el
  árbol porque supera las brechas toleradas y es más pesado sin ganar utilidad.
